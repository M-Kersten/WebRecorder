<!doctype html><html><head><meta charset="utf-8"><title>Portal login</title>
<style>
 body{margin:0;height:100vh;display:grid;place-items:center;background:#0F1115;
      font:16px system-ui,sans-serif;color:#E8EAF0}
 form{background:#171A21;border:1px solid #262B36;border-radius:20px;padding:40px;width:360px}
 h1{margin:0 0 6px;font-size:26px}p{margin:0 0 26px;color:#9AA3B8;font-size:14px}
 label{display:block;font-size:13px;color:#9AA3B8;margin:16px 0 6px}
 input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #262B36;
       background:#0F1115;color:#E8EAF0;font-size:15px;box-sizing:border-box}
 button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:10px;
        background:#E6007E;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
</style></head><body>
<form id="login" onsubmit="event.preventDefault();
  if(document.getElementById('pw').value){
    sessionStorage.setItem('portal-auth','1');
    localStorage.setItem('portal-auth','1');
    location.href='dashboard.html';
  }">
  <h1>Sign in</h1><p>Employee portal</p>
  <label for="email">Email</label><input id="email" type="email" autocomplete="off">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="off">
  <button type="submit" id="signin">Sign in</button>
</form></body></html>
