<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Qapture">
  <title>Qapture</title>
  <!--
    The app icon: the same mark at 59%, on an opaque ground.
    The padding is not decoration - macOS, iOS and Windows all mask an icon to
    their own rounded square, and a mark drawn to the edge loses its corners.
    Scaled rather than redrawn, so the two can never drift apart.
  -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <g transform="translate(50,50) scale(0.59) translate(-50,-50)">
    <g fill="none" stroke="#EC1364" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 36 V7 H36"/>
      <path d="M64 7 H93 V36"/>
      <path d="M93 64 V93 H64"/>
      <path d="M36 93 H7 V64"/>
    </g>
    <path d="M5 2 L5 20 L10 15.5 L13 22 L16.5 20.3 L13.5 14 L20 14 Z"
          transform="translate(27.25,26.1) scale(1.95)" fill="#17171C"/>
  </g>
</svg>
