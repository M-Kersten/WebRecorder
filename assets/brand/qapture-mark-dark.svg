<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Qapture">
  <title>Qapture</title>
  <!--
    Four focus brackets and a pointer: what a capture looks like, and what this
    tool does in one picture. The arrow is not drawn for the logo - it is the
    exact path the recorder paints on every page it walks, from
    src/overlay.js cursorMarkup(), so the mark and the videos share a cursor.

    Brackets: corners at 7 and 93, arms 29 long, stroke 6, round caps and joins.
    Nothing here is a font or a filter, so it stays crisp at any size.

    This is the cut for dark grounds: the pointer goes white. The pink is
    unchanged - it carries on both, which is most of why it was the right pink.
  -->
  <g fill="none" stroke="#EC1364" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 36 V7 H36"/>
    <path d="M64 7 H93 V36"/>
    <path d="M93 64 V93 H64"/>
    <path d="M36 93 H7 V64"/>
  </g>
  <path d="M5 2 L5 20 L10 15.5 L13 22 L16.5 20.3 L13.5 14 L20 14 Z"
        transform="translate(27.25,26.1) scale(1.95)" fill="#FFFFFF"/>
</svg>
